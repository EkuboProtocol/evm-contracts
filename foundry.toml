[profile.default]
src = "src"
out = "out"
libs = ["lib"]
verbosity = 3
# Pin pre-1.8 behavior: each external call in a test must observe state (including
# transient storage) written by earlier calls in the same test, matching mainnet.
# Foundry 1.8 flipped the default to `isolate = true`, which breaks cross-call
# transient storage reads in ExposedStorageTest.
isolate = false
no_match_contract = "SlowTest"
evm_version = 'osaka'
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

solc = '0.8.33'
optimizer = true
optimizer_runs = 9999999
via_ir = true
ignored_error_codes = [2394, 6321, 3860, 5574, 2424, 8429, 4591]
fs_permissions = [{ access = "read", path = "./snapshots" }, { access = "write", path = "./launchpad-manifest.json" }]

# Explicit opt-in for regenerating NFT artwork fixtures.
# UPDATE_SNAPSHOTS=true FOUNDRY_PROFILE=snapshots forge test --offline --match-contract FreeLPMetadataTest
[profile.snapshots]
fs_permissions = [{ access = "read-write", path = "./snapshots" }]

[invariant]
fail_on_revert = true
runs = 1

[profile.ci]
verbosity = 3

# [profile.ci.fuzz]
# runs = 100000
# max_test_rejects = 500000

# [profile.ci.invariant]
# runs = 128

[profile.superfuzz]
verbosity = 3

[profile.superfuzz.fuzz]
runs = 1000000
max_test_rejects = 1000000

[profile.superfuzz.invariant]
runs = 1024

[profile.all_ticks]
no_match_contract = "n/a"
verbosity = 0
gas_limit = "18446744073709551615"
match_test = "test_all_tick_values"
match_contract = "SlowTestAllTicksTest"

[fmt]
# Files formatted with an older formatter whose style 1.8.3 disagrees with.
# Reformatting them would only add version churn, so they are excluded.
ignore = [
    "src/Core.sol",
    "test/FreeLPOwnerPacking.t.sol",
    "test/extensions/SignedExclusiveSwap.t.sol",
    "test/libraries/TWAMMStorageLayout.t.sol",
    "test/math/twamm.t.sol",
    "test/types/poolKey.t.sol",
    "test/types/position.t.sol",
    "test/types/positionId.t.sol",
    "test/types/swapParameters.t.sol",
]
