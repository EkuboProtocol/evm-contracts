name: Set up Solidity toolchain
description: Install pinned Foundry and standalone Solar
runs:
  using: composite
  steps:
    - uses: foundry-rs/foundry-toolchain@v1
      with:
        version: v1.8.7
    # Foundry's bundled Solar predates the assembly support this project needs.
    - name: Install Solar v0.3.1
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/solar.tar.gz"
        destination="$RUNNER_TEMP/solar-0.3.1"
        curl --fail --location --retry 3 \
          https://github.com/paradigmxyz/solar/releases/download/v0.3.1/solar-x86_64-unknown-linux-gnu.tar.gz \
          --output "$archive"
        echo "0a620c9da5918c773a8630a8a25da83ee2b6101dcf53b7eea304af96b41e8b4a  $archive" | sha256sum --check
        mkdir -p "$destination"
        tar -xzf "$archive" -C "$destination" --strip-components=1
        echo "$destination" >> "$GITHUB_PATH"
