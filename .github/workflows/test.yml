name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry and Solar
        uses: ./.github/actions/setup-toolchain

      - name: Show Forge version
        run: |
          forge --version
          solar --version

      - name: Run Forge fmt
        continue-on-error: true
        run: forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --offline --sizes
        id: build

      - name: Run DeployAll script
        run: |
          forge script --offline script/DeployAll.s.sol
        id: deploy-all

      - name: Run Forge tests
        run: |
          forge test --offline --gas-snapshot-check=true -vvv
        id: test
