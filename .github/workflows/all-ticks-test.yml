name: All Ticks Test

on:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: all_ticks

jobs:
  all-ticks-test:
    name: Run All Ticks Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry and Solar
        uses: ./.github/actions/setup-toolchain

      - name: Show Forge version
        run: |
          forge --version
          solar --version

      - name: Run All Ticks Test
        run: |
          forge test --offline
